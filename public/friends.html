<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forkit" />
  <meta name="theme-color" content="#17161A" />
<title>Forkit — friends</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; background: #17161A; min-height: 100vh;
    display: flex; justify-content: center; color: #F5F1E8;
    position: relative; overflow-x: hidden;
  }
    @keyframes drift {
    0%   { transform: translate(0px, 0px) scale(1); }
    50%  { transform: translate(24px, 28px) scale(1.08); }
    100% { transform: translate(-16px, -12px) scale(0.95); }
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
  .glow-1 { width: 480px; height: 480px; top: -100px; right: -100px; background: radial-gradient(circle, #8E5FB0 0%, transparent 70%); opacity: 0.55; animation: drift 22s ease-in-out infinite alternate; }

  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; padding: 40px 16px 100px; }
  .topbar { margin-bottom: 20px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; color: #F5F1E8; }
  .logo span { color: #C7511F; }
  h1 { font-size: 19px; margin-top: 14px; }
  .sub { font-size: 13px; color: #9C9587; margin-top: 3px; margin-bottom: 20px; }

  .friend-card {
    background: #201F1C; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .friend-avatar {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .friend-info { flex: 1; min-width: 0; }
  .friend-name { font-size: 14.5px; font-weight: 700; color: #F5F1E8; }
  .friend-sub { font-size: 11.5px; color: #6B6759; margin-top: 2px; }
  .friend-balance { text-align: right; }
  .friend-amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14.5px; }
  .friend-amt.owed { color: #6FCF97; }
  .friend-amt.owing { color: #E08A6B; }
  .friend-amt.even { color: #6B6759; }
  .friend-label { font-size: 10px; color: #6B6759; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.03em; }

  .empty { text-align: center; padding: 60px 20px; color: #6B6759; font-size: 13.5px; line-height: 1.6; }
  .loading { text-align: center; padding: 60px 20px; color: #6B6759; font-size: 13px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: rgba(23,22,26,0.92); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.08); z-index: 10;
  }
  .nav-inner { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-around; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6759; font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 0; }
  .nav-item.active { color: #E8703C; }
  .nav-icon svg { width: 21px; height: 21px; display: block; }
  .nav-item.scan-item { position: relative; top: -14px; }
  .scan-btn-fab { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #C7511F, #E8703C); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(199,81,31,0.5); margin-bottom: 3px; }
  .scan-btn-fab svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="glow glow-1"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="logo">fork<span>it</span></div>
      <h1>Friends</h1>
      <div class="sub">Everyone you've split a bill with, and where things stand</div>
    </div>

    <div id="list" class="loading">Loading…</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-inner">
      <a class="nav-item" href="/home.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></div>
        <div>Home</div>
      </a>
      <a class="nav-item" href="/history.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg></div>
        <div>History</div>
      </a>
      <a class="nav-item scan-item" href="/scan.html">
        <div class="scan-btn-fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      </a>
      <a class="nav-item active" href="/friends.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="8.5" cy="7" r="3.2"/><path d="M2.5 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15 20c.1-2.6 2-4.5 4.6-4.5"/></svg></div>
        <div>Friends</div>
      </a>
      <a class="nav-item" href="/account.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4.9a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-.9-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-.9c.5.4 1.1.75 1.7 1L11 21h4l.3-2.9c.6-.25 1.2-.6 1.7-1l2.4.9 2-3.4-2-1.6z"/></svg></div>
        <div>Account</div>
      </a>
    </div>
  </div>

  <script>
    const myName = localStorage.getItem('split_user_name');
    if (!myName) window.location.href = '/';

    const AVATAR_COLORS = ['#C7511F', '#3A6EA5', '#2F6F4E', '#B8860B', '#8E5FB0', '#C24C6E'];
    function colorFor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }
    function initials(name) {
      return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function computeAllTotals(items, taxTipRate) {
      const byPerson = {};
      items.forEach(item => {
        item.claims.forEach(c => {
          if (!byPerson[c.claimerSession]) byPerson[c.claimerSession] = { name: c.claimerName, subtotal: 0 };
          byPerson[c.claimerSession].subtotal += item.price / item.claims.length;
        });
      });
      Object.values(byPerson).forEach(p => {
        p.taxTip = p.subtotal * taxTipRate;
        p.total = p.subtotal + p.taxTip;
      });
      return byPerson;
    }

    async function load() {
      const res = await fetch('/api/history/' + encodeURIComponent(myName));
      const { entries } = await res.json();

      // Aggregate a running balance per friend across every split we've shared
      const friends = {}; // name -> { splitCount, netBalance } (positive = they owe you, negative = you owe them)

      entries.forEach(({ split, isPayer, claimerSessions }) => {
        const taxTipRate = split.subtotal > 0 ? split.tax_tip / split.subtotal : 0;
        const payments = split.payments || [];

        if (isPayer) {
          const allTotals = computeAllTotals(split.items, taxTipRate);
          Object.entries(allTotals).forEach(([sess, p]) => {
            if (p.name.trim().toLowerCase() === myName.trim().toLowerCase()) return;
            const paid = payments.some(pay => pay.claimerSession === sess);
            if (!friends[p.name]) friends[p.name] = { splitCount: 0, netBalance: 0 };
            friends[p.name].splitCount += 1;
            if (!paid) friends[p.name].netBalance += p.total; // they owe you
          });
        } else {
          if (split.payer_name.trim().toLowerCase() === myName.trim().toLowerCase()) return;
          const mySession = claimerSessions[0];
          const allTotals = computeAllTotals(split.items, taxTipRate);
          const mine = allTotals[mySession];
          if (!mine) return;
          const paid = payments.some(p => p.claimerSession === mySession);
          const name = split.payer_name;
          if (!friends[name]) friends[name] = { splitCount: 0, netBalance: 0 };
          friends[name].splitCount += 1;
          if (!paid) friends[name].netBalance -= mine.total; // you owe them
        }
      });

      const list = document.getElementById('list');
      const names = Object.keys(friends);

      if (names.length === 0) {
        list.outerHTML = `<div class="empty">No friends yet — split a bill and they'll show up here.</div>`;
        return;
      }

      const cardsHtml = names
        .sort((a, b) => Math.abs(friends[b].netBalance) - Math.abs(friends[a].netBalance))
        .map(name => {
          const f = friends[name];
          const isOwed = f.netBalance > 0.005;
          const isOwing = f.netBalance < -0.005;
          const amtClass = isOwed ? 'owed' : isOwing ? 'owing' : 'even';
          const amtText = isOwed ? `+$${f.netBalance.toFixed(2)}` : isOwing ? `-$${Math.abs(f.netBalance).toFixed(2)}` : 'settled up';
          const label = isOwed ? 'owes you' : isOwing ? 'you owe' : '';

          return `
            <div class="friend-card">
              <div class="friend-avatar" style="background:${colorFor(name)}">${initials(name)}</div>
              <div class="friend-info">
                <div class="friend-name">${name}</div>
                <div class="friend-sub">${f.splitCount} split${f.splitCount === 1 ? '' : 's'} together</div>
              </div>
              <div class="friend-balance">
                <div class="friend-amt ${amtClass}">${amtText}</div>
                ${label ? `<div class="friend-label">${label}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

      list.outerHTML = `<div id="list">${cardsHtml}</div>`;
    }

    load();
  </script>
</body>
</html>
