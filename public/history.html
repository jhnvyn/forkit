<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forkit" />
  <meta name="theme-color" content="#17161A" />
<title>Forkit — my splits</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #17161A; min-height: 100vh; display: flex; justify-content: center; padding: 40px 16px; color: #F5F1E8; position: relative; overflow-x: hidden; }
  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; color: #F5F1E8; }
  .logo span { color: #C7511F; }
  .new-btn { font-size: 13px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #C7511F, #E8703C); border: none; border-radius: 999px; padding: 9px 16px; text-decoration: none; }

  .summary-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .summary-card { flex: 1; background: #201F1C; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 14px; text-align: center; }
  .summary-amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; }
  .summary-amt.owed { color: #6FCF97; }
  .summary-amt.owing { color: #E08A6B; }
  .summary-label { font-size: 11.5px; color: #9C9587; margin-top: 2px; }

  .split-card { background: #201F1C; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .split-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .split-name { font-size: 14.5px; font-weight: 700; color: #F5F1E8; }
  .split-date { font-size: 11.5px; color: #9C9587; margin-top: 2px; }
  .split-role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); color: #C9C2B3; }
  .split-body { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); }
  .split-line { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; color: #C9C2B3; }
  .split-line .amt { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #F5F1E8; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status-pill.paid { background: rgba(111,207,151,0.15); color: #6FCF97; }
  .status-pill.unpaid { background: rgba(224,138,107,0.15); color: #E08A6B; }
  .status-pill.partial { background: rgba(232,163,66,0.15); color: #E8A342; }
  .view-link { display: block; text-align: center; font-size: 12px; color: #E8703C; font-weight: 600; text-decoration: none; margin-top: 10px; }

  .empty { text-align: center; padding: 60px 20px; color: #9C9587; font-size: 13.5px; line-height: 1.6; }
  .loading { text-align: center; padding: 60px 20px; color: #9C9587; font-size: 13px; }
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: rgba(23,22,26,0.92); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.08); z-index: 10;
  }
  .nav-inner { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-around; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6759; font-size: 10.5px; font-weight: 600; flex: 1; padding: 4px 0; }
  .nav-item.active { color: #E8703C; }
  .nav-icon svg { width: 21px; height: 21px; display: block; }
  .nav-item.scan-item { position: relative; top: -14px; }
  .scan-btn-fab { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #C7511F, #E8703C); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(199,81,31,0.5); margin-bottom: 3px; }
  .scan-btn-fab svg { width: 22px; height: 22px; }
  @keyframes drift {
    0%   { transform: translate(0px, 0px) scale(1); }
    50%  { transform: translate(24px, 28px) scale(1.08); }
    100% { transform: translate(-16px, -12px) scale(0.95); }
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
  .glow-1 { width: 512px; height: 512px; top: -100px; right: -100px; background: radial-gradient(circle, #C7511F 0%, transparent 70%); opacity: 0.55; animation: drift 22s ease-in-out infinite alternate; }
  .glow-2 { width: 448px; height: 448px; bottom: -80px; left: -100px; background: radial-gradient(circle, #8E5FB0 0%, transparent 70%); opacity: 0.35; animation: drift 27s ease-in-out infinite alternate-reverse; }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="wrap" style="padding-bottom: 90px;">
    <div class="topbar">
      <div class="logo">fork<span>it</span></div>
      <a class="new-btn" href="/scan.html">+ New split</a>
    </div>

    <div id="summaryRow"></div>
    <div id="list" class="loading">Loading your splits…</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-inner">
      <a class="nav-item" href="/home.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></div>
        <div>Home</div>
      </a>
      <a class="nav-item active" href="/history.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg></div>
        <div>History</div>
      </a>
      <a class="nav-item scan-item" href="/scan.html">
        <div class="scan-btn-fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      </a>
      <a class="nav-item" href="/friends.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="8.5" cy="7" r="3.2"/><path d="M2.5 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15 20c.1-2.6 2-4.5 4.6-4.5"/></svg></div>
        <div>Friends</div>
      </a>
      <a class="nav-item" href="/account.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4.9a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-.9-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-.9c.5.4 1.1.75 1.7 1L11 21h4l.3-2.9c.6-.25 1.2-.6 1.7-1l2.4.9 2-3.4-2-1.6z"/></svg></div>
        <div>Account</div>
      </a>
    </div>
  </div>

  <script>
    const myName = localStorage.getItem('split_user_name');

    if (!myName) {
      window.location.href = '/';
    }

    function computeAllTotals(items, taxTipRate) {
      const byPerson = {};
      items.forEach(item => {
        item.claims.forEach(c => {
          if (!byPerson[c.claimerSession]) byPerson[c.claimerSession] = { name: c.claimerName, subtotal: 0 };
          byPerson[c.claimerSession].subtotal += item.price / item.claims.length;
        });
      });
      Object.values(byPerson).forEach(p => {
        p.taxTip = p.subtotal * taxTipRate;
        p.total = p.subtotal + p.taxTip;
      });
      return byPerson;
    }

    async function load() {
      const res = await fetch('/api/history/' + encodeURIComponent(myName));
      const { entries } = await res.json();

      if (entries.length === 0) {
        document.getElementById('list').outerHTML = `
          <div class="empty">No splits yet.<br/>Create your first one to get started.</div>
        `;
        return;
      }

      let totalOwedToMe = 0;
      let totalIOwe = 0;

      const cardsHtml = entries.map(({ split, isPayer, claimerSessions }) => {
        const taxTipRate = split.subtotal > 0 ? split.tax_tip / split.subtotal : 0;
        const items = split.items;
        const payments = split.payments || [];
        const date = new Date(split.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

        if (isPayer) {
          const allTotals = computeAllTotals(items, taxTipRate);
          const others = Object.entries(allTotals);
          const paidCount = others.filter(([sess]) => payments.some(p => p.claimerSession === sess)).length;
          const owedToMe = others.reduce((sum, [sess, p]) => {
            const paid = payments.some(pay => pay.claimerSession === sess);
            return sum + (paid ? 0 : p.total);
          }, 0);
          totalOwedToMe += owedToMe;

          const linesHtml = others.map(([sess, p]) => {
            const paid = payments.some(pay => pay.claimerSession === sess);
            return `
              <div class="split-line">
                <span>${p.name}</span>
                <span class="amt">$${p.total.toFixed(2)} <span class="status-pill ${paid ? 'paid' : 'unpaid'}">${paid ? 'paid' : 'unpaid'}</span></span>
              </div>
            `;
          }).join('');

          return `
            <div class="split-card">
              <div class="split-top">
                <div>
                  <div class="split-name">${split.restaurant_name}</div>
                  <div class="split-date">${date} · you paid</div>
                </div>
                <div class="split-role">payer</div>
              </div>
              <div class="split-body">
                ${linesHtml || '<div class="split-line" style="color:#6B6759">no one has claimed items yet</div>'}
              </div>
              <a class="view-link" href="/s/${split.id}">View split →</a>
            </div>
          `;
        } else {
          // I was a claimer — find my own total + paid status
          const mySession = claimerSessions[0];
          const allTotals = computeAllTotals(items, taxTipRate);
          const mine = allTotals[mySession];
          if (!mine) return '';
          const paid = payments.some(p => p.claimerSession === mySession);
          if (!paid) totalIOwe += mine.total;

          return `
            <div class="split-card">
              <div class="split-top">
                <div>
                  <div class="split-name">${split.restaurant_name}</div>
                  <div class="split-date">${date} · paid by ${split.payer_name}</div>
                </div>
                <div class="split-role">you owe</div>
              </div>
              <div class="split-body">
                <div class="split-line">
                  <span>Your share</span>
                  <span class="amt">$${mine.total.toFixed(2)} <span class="status-pill ${paid ? 'paid' : 'unpaid'}">${paid ? 'paid' : 'unpaid'}</span></span>
                </div>
              </div>
              <a class="view-link" href="/s/${split.id}">View split →</a>
            </div>
          `;
        }
      }).join('');

      document.getElementById('summaryRow').innerHTML = `
        <div class="summary-row">
          <div class="summary-card">
            <div class="summary-amt owed">$${totalOwedToMe.toFixed(2)}</div>
            <div class="summary-label">owed to you</div>
          </div>
          <div class="summary-card">
            <div class="summary-amt owing">$${totalIOwe.toFixed(2)}</div>
            <div class="summary-label">you still owe</div>
          </div>
        </div>
      `;

      document.getElementById('list').outerHTML = `<div id="list">${cardsHtml}</div>`;
    }

    load();
  </script>
</body>
</html>
