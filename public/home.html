<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forkit" />
  <meta name="theme-color" content="#17161A" />
<title>Forkit — home</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; background: #17161A; min-height: 100vh;
    display: flex; justify-content: center; color: #F5F1E8;
    position: relative; overflow-x: hidden;
  }
    @keyframes drift {
    0%   { transform: translate(0px, 0px) scale(1); }
    50%  { transform: translate(24px, 28px) scale(1.08); }
    100% { transform: translate(-16px, -12px) scale(0.95); }
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0; }
  .glow-1 { width: 512px; height: 512px; top: -100px; right: -100px; background: radial-gradient(circle, #C7511F 0%, transparent 70%); opacity: 0.55; animation: drift 22s ease-in-out infinite alternate; }
  .glow-2 { width: 448px; height: 448px; bottom: 60px; left: -100px; background: radial-gradient(circle, #8E5FB0 0%, transparent 70%); opacity: 0.35; animation: drift 27s ease-in-out infinite alternate-reverse; }

  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; padding: 40px 16px 100px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; color: #F5F1E8; }
  .logo span { color: #C7511F; }
  .greeting-sub { font-size: 12.5px; color: #6B6759; margin-top: 2px; }

  .avatar-chip {
    width: 38px; height: 38px; border-radius: 50%; background: #2F6F4E;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff;
  }

  .summary-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .summary-card { flex: 1; background: #201F1C; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; }
  .summary-amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; }
  .summary-amt.owed { color: #6FCF97; }
  .summary-amt.owing { color: #E08A6B; }
  .summary-label { font-size: 11.5px; color: #9C9587; margin-top: 3px; }

  .cta-card {
    background: linear-gradient(135deg, #C7511F, #E8703C);
    border-radius: 18px; padding: 20px; margin-bottom: 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; text-decoration: none; color: #fff;
    transition: transform 0.15s ease;
  }
  .cta-card:active { transform: scale(0.98); }
  .cta-text h3 { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  .cta-text p { font-size: 12.5px; opacity: 0.9; }
  .cta-icon { font-size: 30px; }

  .section-title { font-size: 12px; text-transform: lowercase; color: #6B6759; margin-bottom: 10px; letter-spacing: 0.03em; }

  .recent-card {
    background: #201F1C; border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
    padding: 13px 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: inherit;
  }
  .recent-name { font-size: 13.5px; font-weight: 600; color: #F5F1E8; }
  .recent-date { font-size: 11px; color: #6B6759; margin-top: 1px; }
  .recent-amt { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #C9C2B3; }

  .empty { text-align: center; padding: 30px 20px; color: #6B6759; font-size: 13px; line-height: 1.6; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: rgba(23,22,26,0.92); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.08); z-index: 10;
  }
  .nav-inner { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-around; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: #6B6759; font-size: 10.5px; font-weight: 600;
    flex: 1; padding: 4px 0;
  }
  .nav-item.active { color: #E8703C; }
  .nav-icon svg { width: 21px; height: 21px; display: block; }
  .nav-item.scan-item { position: relative; top: -14px; }
  .scan-btn-fab {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #C7511F, #E8703C);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(199,81,31,0.5); margin-bottom: 3px;
  }
  .scan-btn-fab svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="logo">fork<span>it</span></div>
        <div class="greeting-sub" id="greeting">Welcome back</div>
      </div>
      <div class="avatar-chip" id="avatarChip">?</div>
    </div>

    <div class="summary-row">
      <div class="summary-card">
        <div class="summary-amt owed" id="owedAmt">$0.00</div>
        <div class="summary-label">owed to you</div>
      </div>
      <div class="summary-card">
        <div class="summary-amt owing" id="owingAmt">$0.00</div>
        <div class="summary-label">you still owe</div>
      </div>
    </div>

    <a class="cta-card" href="/scan.html">
      <div class="cta-text">
        <h3>Split a new bill</h3>
        <p>Scan a receipt or enter it yourself</p>
      </div>
      <div class="cta-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
          <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
    </a>

    <div class="section-title">recent splits</div>
    <div id="recentList"><div class="empty">Loading…</div></div>
  </div>

  <div class="bottom-nav">
    <div class="nav-inner">
      <a class="nav-item active" href="/home.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></div>
        <div>Home</div>
      </a>
      <a class="nav-item" href="/history.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg></div>
        <div>History</div>
      </a>
      <a class="nav-item scan-item" href="/scan.html">
        <div class="scan-btn-fab"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      </a>
      <a class="nav-item" href="/friends.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="8.5" cy="7" r="3.2"/><path d="M2.5 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="8.5" r="2.6"/><path d="M15 20c.1-2.6 2-4.5 4.6-4.5"/></svg></div>
        <div>Friends</div>
      </a>
      <a class="nav-item" href="/account.html">
        <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4.9a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-.9-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-.9c.5.4 1.1.75 1.7 1L11 21h4l.3-2.9c.6-.25 1.2-.6 1.7-1l2.4.9 2-3.4-2-1.6z"/></svg></div>
        <div>Account</div>
      </a>
    </div>
  </div>

  <script>
    const myName = localStorage.getItem('split_user_name');
    if (!myName) window.location.href = '/';

    document.getElementById('greeting').textContent = `Hey, ${myName}`;
    document.getElementById('avatarChip').textContent = myName.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();

    function computeAllTotals(items, taxTipRate) {
      const byPerson = {};
      items.forEach(item => {
        item.claims.forEach(c => {
          if (!byPerson[c.claimerSession]) byPerson[c.claimerSession] = { name: c.claimerName, subtotal: 0 };
          byPerson[c.claimerSession].subtotal += item.price / item.claims.length;
        });
      });
      Object.values(byPerson).forEach(p => {
        p.taxTip = p.subtotal * taxTipRate;
        p.total = p.subtotal + p.taxTip;
      });
      return byPerson;
    }

    async function load() {
      const res = await fetch('/api/history/' + encodeURIComponent(myName));
      const { entries } = await res.json();

      let totalOwedToMe = 0;
      let totalIOwe = 0;

      const cards = entries.slice(0, 6).map(({ split, isPayer, claimerSessions }) => {
        const taxTipRate = split.subtotal > 0 ? split.tax_tip / split.subtotal : 0;
        const payments = split.payments || [];
        const date = new Date(split.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

        if (isPayer) {
          const allTotals = computeAllTotals(split.items, taxTipRate);
          const others = Object.entries(allTotals);
          const owedToMe = others.reduce((sum, [sess, p]) => {
            const paid = payments.some(pay => pay.claimerSession === sess);
            return sum + (paid ? 0 : p.total);
          }, 0);
          totalOwedToMe += owedToMe;
          return `
            <a class="recent-card" href="/pending.html?id=${split.id}">
              <div>
                <div class="recent-name">${split.restaurant_name}</div>
                <div class="recent-date">${date} · you paid</div>
              </div>
              <div class="recent-amt">${owedToMe > 0 ? '+$' + owedToMe.toFixed(2) : 'settled'}</div>
            </a>
          `;
        } else {
          const mySession = claimerSessions[0];
          const allTotals = computeAllTotals(split.items, taxTipRate);
          const mine = allTotals[mySession];
          if (!mine) return '';
          const paid = payments.some(p => p.claimerSession === mySession);
          if (!paid) totalIOwe += mine.total;
          return `
            <a class="recent-card" href="/s/${split.id}">
              <div>
                <div class="recent-name">${split.restaurant_name}</div>
                <div class="recent-date">${date} · paid by ${split.payer_name}</div>
              </div>
              <div class="recent-amt">${paid ? 'paid' : '-$' + mine.total.toFixed(2)}</div>
            </a>
          `;
        }
      }).join('');

      document.getElementById('owedAmt').textContent = '$' + totalOwedToMe.toFixed(2);
      document.getElementById('owingAmt').textContent = '$' + totalIOwe.toFixed(2);

      document.getElementById('recentList').innerHTML = cards || `<div class="empty">No splits yet — tap the <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> to start one.</div>`;
    }

    load();
  </script>
</body>
</html>
